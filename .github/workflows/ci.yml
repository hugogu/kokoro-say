name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      # With the model present the tests that speak for real run; without it
      # they are skipped. Bump the key if the model files change.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/kokoro-onnx
          key: kokoro-onnx-model-v1.0
      # The zh extra is skipped by itself on Python 3.13 and later
      - run: uv sync --extra zh --extra mcp
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Downloads the model when the cache is cold, through the installed command.
      - run: uv run ksay -v '?'
      - run: uv run pytest -rs
      - name: Save a sentence and read it back
        run: |
          uv run ksay "Hello from CI." -o "$RUNNER_TEMP/hello.wav"
          uv run python -c "import sys, soundfile as sf; d = sf.info(sys.argv[1]).duration; assert 0.5 < d < 5, d" "$RUNNER_TEMP/hello.wav"
      # Chinese, with a mixed sentence; the text goes in a file so that no shell has to
      # carry it, and is written with escapes so that no editor has to either
      - name: Save Chinese text and read it back
        run: |
          uv run python -c "import sys; open(sys.argv[1], 'w', encoding='utf-8').write('\u4f60\u597d\uff0c\u4e16\u754c\u3002 Today\u2019s meeting is at noon.')" "$RUNNER_TEMP/zh.txt"
          uv run ksay -v zf_xiaobei -f "$RUNNER_TEMP/zh.txt" -o "$RUNNER_TEMP/zh.wav"
          uv run python -c "import sys, soundfile as sf; d = sf.info(sys.argv[1]).duration; assert 1.5 < d < 12, d" "$RUNNER_TEMP/zh.wav"
      # Runners have no speakers: playing must either work or fail with a message.
      - name: Play a sentence without a usable audio device
        run: |
          for flags in "" "--stream"; do
            set +e
            output=$(uv run ksay $flags "Hello from CI." 2>&1)
            status=$?
            set -e
            echo "ksay $flags -> exit $status: $output"
            test "$status" -le 1
            if grep -q Traceback <<<"$output"; then exit 1; fi
          done
      # An ALSA default device that writes what it is given to a file stands in
      # for a sound card, so PortAudio's playback is tested for real.
      - name: Play through a fake sound card
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libportaudio2
          cat > ~/.asoundrc <<ASOUND
          pcm.!default {
              type plug
              slave { pcm "dump"; format S16_LE; rate 48000; channels 2 }
          }
          pcm.dump {
              type file
              slave.pcm "null"
              file "$RUNNER_TEMP/played.raw"
              format "raw"
          }
          ASOUND
          for flags in "" "--stream"; do
            rm -f "$RUNNER_TEMP/played.raw"
            uv run ksay $flags "Hello from CI."
            bytes=$(stat -c %s "$RUNNER_TEMP/played.raw")
            echo "ksay $flags played $bytes bytes"
            test "$bytes" -gt 150000 -a "$bytes" -lt 400000  # about 1.2 s at 192 kB/s
          done
