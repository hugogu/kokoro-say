[project]
name = "kokoro-say"
dynamic = ["version"]
description = "Speak or save text with the Kokoro-82M voices from the command line, like macOS say."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hugo Gu" }]
keywords = ["tts", "text-to-speech", "kokoro", "onnx", "cli", "say"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["kokoro-onnx>=0.6.1", "sounddevice>=0.5", "soundfile>=0.12"]

[project.optional-dependencies]
# Kokoro's own Chinese front end. It adds about 100 MB, and misaki declares
# support for Python before 3.13 only.
zh = ["misaki[zh]>=0.9.4; python_version < '3.13'"]

[project.urls]
Homepage = "https://github.com/hugogu/kokoro-say"
Issues = "https://github.com/hugogu/kokoro-say/issues"

[project.scripts]
ksay = "kokoro_say.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kokoro_say/__init__.py"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_model: speaks with the real model, so is skipped without its files"]
